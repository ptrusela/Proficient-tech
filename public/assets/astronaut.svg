<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 600" width="400" height="600">
  <rect width="400" height="600" fill="#000000"/>
  <!-- glow behind figure -->
  <radialGradient id="bg" cx="50%" cy="42%" r="48%">
    <stop offset="0%" stop-color="#ffffff" stop-opacity="0.08"/>
    <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
  </radialGradient>
  <rect width="400" height="600" fill="url(#bg)"/>

  <!-- helmet outer -->
  <ellipse cx="200" cy="158" rx="76" ry="80" fill="#3a3a48" stroke="#8888a0" stroke-width="2.5"/>
  <!-- visor -->
  <ellipse cx="200" cy="153" rx="52" ry="56" fill="#1a1a24" stroke="#6060a0" stroke-width="1.5"/>
  <!-- visor inner glow -->
  <ellipse cx="200" cy="150" rx="44" ry="48" fill="#0a0a12"/>
  <ellipse cx="183" cy="136" rx="20" ry="14" fill="#ffffff" opacity="0.10" transform="rotate(-15 183 136)"/>
  <!-- helmet highlight ridge -->
  <path d="M148 120 Q200 92 252 120" stroke="#aaaacc" stroke-width="2" fill="none" opacity="0.5"/>

  <!-- neck ring -->
  <rect x="176" y="232" width="48" height="22" rx="7" fill="#555568" stroke="#888899" stroke-width="1.5"/>

  <!-- body torso -->
  <rect x="112" y="248" width="176" height="188" rx="32" fill="#484858" stroke="#888899" stroke-width="2"/>

  <!-- chest panel -->
  <rect x="148" y="278" width="104" height="68" rx="10" fill="#2a2a38" stroke="#666688" stroke-width="1.5"/>
  <!-- panel detail -->
  <circle cx="167" cy="294" r="6" fill="#aaaacc" opacity="0.6"/>
  <circle cx="185" cy="294" r="6" fill="#aaaacc" opacity="0.3"/>
  <circle cx="203" cy="294" r="6" fill="#aaaacc" opacity="0.2"/>
  <rect x="158" y="312" width="84" height="4" rx="2" fill="#aaaacc" opacity="0.25"/>
  <rect x="158" y="322" width="60" height="4" rx="2" fill="#aaaacc" opacity="0.15"/>
  <!-- shoulder stripes -->
  <rect x="112" y="260" width="40" height="6" rx="3" fill="#aaaacc" opacity="0.3"/>
  <rect x="248" y="260" width="40" height="6" rx="3" fill="#aaaacc" opacity="0.3"/>

  <!-- left arm -->
  <rect x="56" y="254" width="60" height="120" rx="24" fill="#545465" stroke="#888899" stroke-width="2"/>
  <!-- right arm -->
  <rect x="284" y="254" width="60" height="120" rx="24" fill="#545465" stroke="#888899" stroke-width="2"/>

  <!-- left glove -->
  <ellipse cx="86" cy="384" rx="32" ry="22" fill="#383845" stroke="#777788" stroke-width="1.5"/>
  <!-- right glove -->
  <ellipse cx="314" cy="384" rx="32" ry="22" fill="#383845" stroke="#777788" stroke-width="1.5"/>

  <!-- left leg -->
  <rect x="135" y="430" width="56" height="112" rx="20" fill="#545465" stroke="#888899" stroke-width="2"/>
  <!-- right leg -->
  <rect x="209" y="430" width="56" height="112" rx="20" fill="#545465" stroke="#888899" stroke-width="2"/>

  <!-- left boot -->
  <rect x="122" y="524" width="82" height="30" rx="12" fill="#383845" stroke="#666677" stroke-width="1.5"/>
  <!-- right boot -->
  <rect x="196" y="524" width="82" height="30" rx="12" fill="#383845" stroke="#666677" stroke-width="1.5"/>

  <!-- backpack hint -->
  <rect x="268" y="270" width="26" height="60" rx="8" fill="#3a3a4a" stroke="#666688" stroke-width="1.5" opacity="0.8"/>

  <!-- subtle ambient dots (stars reflected in visor) -->
  <circle cx="192" cy="145" r="1.2" fill="#ffffff" opacity="0.5"/>
  <circle cx="208" cy="158" r="0.9" fill="#ffffff" opacity="0.3"/>
  <circle cx="196" cy="165" r="0.7" fill="#ffffff" opacity="0.25"/>
</svg>
